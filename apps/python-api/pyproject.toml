[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aipd-python-api"
version = "0.1.0"
description = "FastAPI reference application for the AI Project Detector."
requires-python = ">=3.10"
dependencies = [
    "aiprojectdetector",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
queue = ["redis>=5.0", "rq>=1.16"]
dev = ["pytest>=7.4", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
