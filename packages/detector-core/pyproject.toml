[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiprojectdetector"
version = "0.1.0"
description = "Probabilistic detection engine that estimates the likelihood that source code was AI-generated. Never claims certainty."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Project Detector contributors" }]
keywords = ["ai-detection", "stylometry", "static-analysis", "llm", "code-analysis"]

dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Heavier / optional capabilities. The core engine degrades gracefully when
# these are not installed (see aiprojectdetector.optional_deps).
git = ["GitPython>=3.1"]
ml = ["scikit-learn>=1.3"]
treesitter = ["tree-sitter>=0.21", "tree-sitter-languages>=1.10"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = [
    "GitPython>=3.1",
    "scikit-learn>=1.3",
]

[project.scripts]
aipd = "aiprojectdetector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiprojectdetector*"]

[tool.setuptools.package-data]
aiprojectdetector = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B024"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
